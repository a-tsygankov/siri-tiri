name: Local service tests
on:
  push:
    paths: ['local-service/**', 'contracts/**', '.github/workflows/local-service-ci.yml']
  pull_request:
    paths: ['local-service/**', 'contracts/**', '.github/workflows/local-service-ci.yml']
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s local-service/tests -v
